name: quickauth_flutter
description: Flutter phone authentication SDK — passwordless OTP login over SMS & WhatsApp, OneTap silent re-auth, SMS autofill, and DPDP/GDPR consent.
version: 1.2.1
homepage: https://quickauth.in
repository: https://github.com/quickauthin/quickauth-sdk-flutter
issue_tracker: https://github.com/quickauthin/quickauth-sdk-flutter/issues

topics:
  - authentication
  - otp
  - login
  - sms
  - whatsapp

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  package_info_plus: ">=5.0.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  plugin:
    platforms:
      android:
        package: io.quickauth.sdk_flutter
        pluginClass: QuickAuthSdkFlutterPlugin
      ios:
        pluginClass: QuickAuthSdkFlutterPlugin
